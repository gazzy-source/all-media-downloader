name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Import package smoke test
        run: |
          python -c "
          from bot.config import BOT_NAME, QUALITY_MAP
          from bot.utils.helpers import extract_urls, platform_from_url, progress_bar
          from bot.services.downloader import available_qualities_for
          from bot.utils.instance_lock import acquire_single_instance
          assert extract_urls('see https://youtu.be/dQw4w9WgXcQ')
          assert platform_from_url('https://x.com/a/status/1') == 'X / Twitter'
          assert '720' in available_qualities_for([720, 1080])
          print('smoke ok', BOT_NAME)
          "

      - name: Syntax compile
        run: python -m compileall -q bot run.py

      - name: Lint (pyflakes)
        run: python -m pyflakes bot/

      - name: Run test suite
        env:
          BOT_TOKEN: ""
        run: python -m pytest tests/ -q --tb=short
          --cov=bot --cov-branch --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-3.12
          path: coverage.xml
          if-no-files-found: error
