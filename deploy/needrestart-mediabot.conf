# all-media-downloader: restarted idle-safely by ytdlp-update.timer (waits for
# no queued/running downloads). needrestart must not restart it mid-download.
# Added 2026-11-21 after unattended upgrades restarted it on Oct 24 and Nov 13.
$nrconf{override_rc}{qr(^all-media-downloader\.service$)} = 0;
