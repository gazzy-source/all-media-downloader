[Unit]
Requires=mediabot-egress.service
After=mediabot-egress.service

[Service]
User=mediabot
Group=mediabot
SupplementaryGroups=
StateDirectory=mediabot
Environment=HOME=/var/lib/mediabot
Environment=PATH=/usr/local/bin:/usr/bin:/bin
ProtectSystem=strict
ProtectHome=yes
ReadWritePaths=/opt/all-media-downloader/data /opt/all-media-downloader/temp /opt/all-media-downloader/downloads
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictSUIDSGID=yes
LockPersonality=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
CapabilityBoundingSet=
