# WARP logs DEBUG lines to the journal (3.9 GB by 2026-11-21) and ignores
# RUST_LOG. Drop them before storage; warnings/errors and other INFO are kept.
# WARP colours its level tag (ESC[34mDEBUG), hence the pattern. Also dropped:
# the routine tunnel-stats INFO line (every ~7s) and netlink neighbour notices.
[Service]
LogFilterPatterns=~34mDEBUG
LogFilterPatterns=~MasqueTunnelStatsUpdated
LogFilterPatterns=~^NewNeighbour; Destination:
