# Backstop for warp_memory_guard.sh: if WARP's memory runs away faster than
# the 10-minute guard can react, the kernel kills it inside its own cgroup
# (Restart=always brings it back) instead of swap-thrashing the whole VM.
# Install: /etc/systemd/system/warp-svc.service.d/memory.conf
[Service]
MemoryMax=450M
MemorySwapMax=150M
